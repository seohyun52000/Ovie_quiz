<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>毛囊危機指數測驗</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./favicon.ico" />
</head>

<body>
  <div class="quiz-container">
    <div id="start">
      <img class="bg-pic" src="./images/start/20260831_互動-生活習慣測掉髮危機-封面圖.jpg">
      <div class="btn-item" onclick="startQuiz()">
        <div id="start-btn">
          <img class=" o_btn" src="./images/start/開始按鈕-01.png">
          <img class="h_btn" src="./images/start/開始按鈕-02.png">
        </div>
        <div id="continue-btn">
          <img class=" o_btn" src="./images/start/繼續按鈕-01.png">
          <img class="h_btn" src="./images/start/繼續按鈕-02.png">
        </div>
      </div>
    </div>
    <div id="quiz">
      <div id="prevButton" onclick="previousQuestion()">
        <i class="bi bi-arrow-left-circle"></i>
      </div>
      <div class="title">
        <div class="progress-info">
          <span id="questionNumber">第 1 題 / 共 5 題</span>
        </div>
        <div class="progress-bar">
          <div class="progress" id="progress"></div>
        </div>
      </div>
      <div class="question" id="question">
        題目載入中...
      </div>
      <div class="options" id="options"></div>
    </div>
    <div class="result" id="result">
      <button class="restart-btn" onclick="restartQuiz()">
        再測一次
      </button>
      <div class="result-image" id="resultImage">
      </div>
      <div class="prize-info">
        <img class="bg-pic" src="./images/prize/20260831_毛囊生存戰抽獎資訊V1無CTA版_ol-01.jpg">
        <a class="btn-item btn-item01" target="_blank" href=" https://go-vie.com.tw/Ts1GZ">
          <img class="o_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-02.png">
          <img class="h_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-03.png">
        </a>
        <a class="btn-item btn-item02" target="_blank" href="https://go-vie.com.tw/kTPeS">
          <img class="o_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-04.png">
          <img class="h_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-05.png">
        </a>
        <a class="btn-item btn-item03" target="_blank" href="https://go-vie.com.tw/MzKq7">
          <img class="o_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-06.png">
          <img class="h_btn" src="./images/prize/CTA/20260831_毛囊生存戰抽獎資訊V1-07.png">
        </a>
      </div>
    </div>
  </div>
  <script src="./script.js"></script>
</body>

</html>
